const lab=t=>t.replace(/\//g,'');
function wrongV(){const ws=Object.values(D.wrong).sort((a,b)=>b.cnt-a.cnt);
V(()=>`<div class="qh"><button class="chipb" onclick="nav('me')">⬅ 返回</button></div><h2>📕 错题本</h2>`+(ws.length?`<button class="btn" onclick="wrongPractice()">💪 练习错题</button><p class="hint">答对 2 次，题目就会毕业离开错题本 🎓</p>`+ws.map(w=>`<div class="li"><b>${MD[w.m]?MD[w.m][0]:'❓'}</b><span>${lab(w.t)} <small>· ${MD[w.m]?MD[w.m][1]:''}</small></span><span style="flex:none">${w.cnt>=3?'🚩 多复习哦':'错 '+w.cnt+' 次'}</span></div>`).join(''):`<div class="big"><div class="pic">🎉</div><h2>目前没有错题，你真棒！</h2></div>`))}
function wrongPractice(){const l=Object.values(D.wrong).filter(w=>G[w.m]).sort((a,b)=>b.cnt-a.cnt).slice(0,5).map(w=>({m:w.m,t:w.t}));l.length?play('review',l):toast('错题都是不能重做的类型，先去练一练吧')}
function reviewStart(){const l=Object.values(D.wrong).filter(w=>G[w.m]).sort((a,b)=>b.cnt-a.cnt).slice(0,3).map(w=>({m:w.m,t:w.t})),sn=Object.keys(D.seen).filter(c=>byC[c]);let n=0;
while(l.length<5&&sn.length&&n++<40){const c=rnd(sn),ok=['listen','pic','stroke','cat','sclass'].filter(m=>m=='pic'?E[c]:(m=='stroke'||m=='sclass')?SK[c]:m=='cat'?CAT.includes(c):1);l.push({m:rnd(ok),t:c})}
l.length?play('review',l):toast('先去「学一学」认几个字，再来复习吧～')}
/* 学习总结 */
function sumV(){const n=sumP=='day'?1:sumP=='week'?7:30,ag={};let tot=0,cor=0,days=0;
for(let i=0;i<n;i++){const l=D.log[new Date(Date.now()-i*864e5).toLocaleDateString('sv')];if(!l)continue;let dn=0;for(const m in l){const a=ag[m]=ag[m]||[0,0];a[0]+=l[m][0];a[1]+=l[m][1];tot+=l[m][0];cor+=l[m][1];dn+=l[m][0]}if(dn)days++}
const good=Object.entries(ag).filter(([m,a])=>a[0]>=3&&a[1]/a[0]>=.8&&MD[m]).sort((a,b)=>b[1][1]/b[1][0]-a[1][1]/a[1][0]),weak=Object.entries(ag).filter(([m,a])=>a[0]>=3&&a[1]/a[0]<.7&&MD[m]),wc=Object.values(D.wrong).sort((a,b)=>b.cnt-a.cnt).slice(0,5).map(w=>lab(w.t));
const pr=[];if(tot)pr.push(`这段时间一共答了 ${tot} 题，答对 ${cor} 题，真不错！`);if(days>=2||(sumP=='day'&&days))pr.push(`坚持练习了 ${days} 天，坚持的小朋友最闪亮！✨`);good.slice(0,2).forEach(([m,a])=>pr.push(`你在「${MD[m][1]}」特别棒，正确率 ${Math.round(a[1]/a[0]*100)}%！`));
const wk=weak.map(([m,a])=>`「${MD[m][1]}」还有一点点小挑战（正确率 ${Math.round(a[1]/a[0]*100)}%），多练几次一定会更棒！`);if(wc.length)wk.push(`这几个小题想再和你玩一玩：${wc.join('、')}，去「复习」里找它们吧～`);
V(()=>`<div class="qh"><button class="chipb" onclick="nav('me')">⬅ 返回</button></div><h2>🏅 学习总结</h2><div class="tabs">${[['day','今天'],['week','本周'],['month','本月']].map(([k,l])=>`<button class="chipb ${k==sumP?'on':''}" onclick="sumP='${k}';sumV()">${l}</button>`).join('')}</div>
<div class="panel">${tot?`<h3>🌟 你做得很棒的地方</h3>${pr.map(x=>`<p>${x}</p>`).join('')}${wk.length?`<h3>🌱 可以再加油的地方</h3>${wk.map(x=>`<p>${x}</p>`).join('')}<p>慢慢来，每天进步一点点，你已经很了不起啦！</p>`:'<p>目前没有薄弱的地方，继续保持！</p>'}`:`<p>这段时间还没有练习记录，来闯一关吧，迈出第一步就是最勇敢的！🌱</p>`}</div>`)}
/* ===== 设置 / 家长模式 ===== */
function pin(){const p=D.cfg.pin;if(!p){const n=prompt('首次使用，请家长设置4位数字密码');if(n&&/^\d{4}$/.test(n)){D.cfg.pin=n;save();pOpen=1}else toast('密码需要是4位数字')}else if(prompt('请输入家长密码')==p)pOpen=1;else toast('密码不对哦');setV()}
const setCfg=(k,v)=>{D.cfg[k]=+v;save()};
function setV(){const mn=Math.round((D.use[day()]||0)/60);
V(()=>`<h2>⚙️ 设置</h2><div class="panel"><h3>🔊 朗读方式</h3>${[['auto','自动（推荐）'],['offline','离线录音优先'],['system','手机自带朗读'],['online','在线真人音（逐词）']].map(([k,l])=>`<label class="rd"><input type="radio" name="tts" ${D.cfg.tts==k?'checked':''} onchange="D.cfg.tts='${k}';save()">${l}</label>`).join('')}<p class="hint">自动：苹果手机先用自带朗读，失败再用离线录音；华为等其他手机先用离线录音（整句），没有再用在线逐词真人音，最后才用自带朗读。</p><button class="btn" style="font-size:20px" onclick="say(PROMPTS[8])">🔊 声音测试</button></div>
<div class="panel"><h3>👨‍👩‍👧 家长模式</h3>${pOpen?`<p>今天已学习 <b>${mn}</b> 分钟</p><p>每日时长上限 <select onchange="setCfg('limit',this.value)">${[[0,'不限制'],[20,'20分钟'],[30,'30分钟'],[45,'45分钟'],[60,'60分钟']].map(([v,l])=>`<option value="${v}" ${D.cfg.limit==v?'selected':''}>${l}</option>`).join('')}</select></p><p>休息提醒间隔 <select onchange="setCfg('remind',this.value)">${[[0,'关闭'],[15,'15分钟'],[20,'20分钟'],[30,'30分钟']].map(([v,l])=>`<option value="${v}" ${D.cfg.remind==v?'selected':''}>${l}</option>`).join('')}</select></p><div class="row" style="justify-content:flex-start"><button class="chipb" onclick="const n=prompt('新的4位数字密码');if(/^\\d{4}$/.test(n||'')){D.cfg.pin=n;save();toast('密码已修改')}">修改密码</button><button class="chipb" onclick="if(confirm('确定清空所有学习记录吗？')){localStorage.removeItem('xz_v3');location.reload()}">清空记录</button></div>`:`<p class="hint">可设置每日使用时长、休息提醒间隔。</p><button class="btn" style="font-size:20px" onclick="pin()">进入家长模式</button>`}</div>
<p class="hint">${NAME} v3 · 2026-10-13 · 笔顺动画与在线读音需要联网</p>`)}
/* ===== 休息提醒 / 时长限制 ===== */
let sess=0,resting=0,locked=0;const ov=h=>{const o=$('#ov');o.hidden=!h;o.innerHTML=h};
function rest(){resting=1;stopAll();let s=60;ov(`<div class="oc"><div class="pic">😴</div><h2>大脑说累了，眼睛也需要放松啦～</h2><p>休息一会儿吧，看看远处的绿色，伸伸懒腰！</p><button class="btn" id="rb" disabled>休息 ${s} 秒</button></div>`);say(PROMPTS[9]);
const iv=setInterval(()=>{const b=$('#rb');if(!b)return clearInterval(iv);if(--s>0)b.textContent=`休息 ${s} 秒`;else{clearInterval(iv);b.disabled=false;b.textContent='我休息好啦！';b.onclick=()=>{ov('');sess=0;resting=0}}},1000)}
function lock(){locked=1;stopAll();ov(`<div class="oc"><div class="pic">🌙</div><h2>今天的学习时间到啦，明天见！</h2><button class="btn" onclick="unlock()">家长解锁</button></div>`);say(PROMPTS[10])}
function unlock(){if(prompt('请输入家长密码')==D.cfg.pin){const d=day();D.ext[d]=(D.ext[d]||0)+900;save();ov('');locked=0}else toast('密码不对哦')}
setInterval(()=>{if(document.hidden||resting||locked)return;sess++;const d=day();D.use[d]=(D.use[d]||0)+1;if(sess%30==0)save();
if(D.cfg.limit&&D.use[d]>=D.cfg.limit*60+(D.ext[d]||0))lock();else if(D.cfg.remind&&sess>=D.cfg.remind*60)rest()},1000);
/* ===== 启动 ===== */
$('#bd').innerHTML=$('#bd2').innerHTML=ICON+`<span>${NAME}</span>`;
{const k=document.createElement('link');k.rel='icon';k.href='data:image/svg+xml,'+encodeURIComponent(ICON);document.head.appendChild(k)}
try{speechSynthesis.getVoices()}catch(e){}
refSt();nav('home');
</script></body></html>
